name: SentinelAI CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test Suite — Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff rapidfuzz bandit

      - name: Install project dependencies (no heavy ML/audio)
        run: |
          pip install httpx requests python-dotenv fastapi pydantic
        continue-on-error: true

      - name: Lint with ruff (including Security checks)
        run: |
          ruff check sentinel/ tests/ --select E,F,W,S --ignore E501
        continue-on-error: false

      - name: Security Audit with Bandit
        run: |
          bandit -r sentinel/ -ll --exclude tests/
        continue-on-error: true # Warning for now until all legacy code is audited

      - name: Run unit tests with coverage
        env:
          SENTINEL_SEMANTIC_ROUTING: "0"   # disable model downloads in CI
          SENTINEL_CODE_SANDBOX_LEVEL: "2"
        run: |
          python -m pytest tests/ -v --tb=short --cov=sentinel --cov-report=term-missing --cov-fail-under=40

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: .coverage

  lint-only:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check sentinel/ tests/ --ignore E501,W291,W293,E302,E303
