[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"sentinel/**" = ["S110", "S603", "S607", "S311", "S104", "S324", "S605", "S606", "S602", "S106", "S107", "S108", "S112", "S113", "S301", "S307", "S102"]
"tests/**" = ["S101", "S105", "S106", "S110", "S603", "S607"]

[tool.coverage.run]
branch = false
omit = [
    "sentinel/app/gui.py",
    "sentinel/app/application.py",
    "sentinel/templates/*",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
